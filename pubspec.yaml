name: packpal
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.5.4
dependencies:
  auto_route: ^9.3.0+1
  cloud_firestore: ^5.6.3
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.7+1
  firebase_core: ^3.11.0
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  path_provider: ^2.1.5
  provider: ^6.1.4
  stylish_bottom_bar: ^1.1.0
  syncfusion_flutter_datepicker: 27.2.5
  uuid: ^4.3.3
dev_dependencies:
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.6
  easy_localization_generator: ^0.3.3
  flutter_launcher_icons: "^0.14.3"
  flutter_test:
    sdk: flutter
  gen:
    path: module/gen
  very_good_analysis: ^7.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "module/gen/assets/icons/app_icon.png"
  min_sdk_android: 21
  min_sdk_ios: 13

flutter:
  uses-material-design: true

  assets:
    - assets/translations/